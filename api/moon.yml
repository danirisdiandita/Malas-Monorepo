$schema: "https://moonrepo.dev/schemas/project.json"
language: "go"

tasks:
  dev:
    command: "go tool air -c .air.toml"
    options:
      persistent: true

  migrate-up:
    command: "go run ./cmd/migrate up"

  migrate-up-seed:
    command: "go run ./cmd/migrate up seed"

  generate:
    command: "go generate ./ent"
